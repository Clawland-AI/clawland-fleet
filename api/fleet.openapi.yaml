openapi: 3.0.3
info:
  title: Clawland Fleet Manager API
  version: 0.1.0
  description: >
    Cloud-edge control plane API used by PicoClaw, MicroClaw, NanoClaw, and
    MoltClaw agents to register nodes, report health and events, and receive
    commands.
servers:
  - url: http://localhost:8080
    description: Local development Fleet Manager
tags:
  - name: Nodes
    description: Edge node registration, heartbeat, and inventory
  - name: Events
    description: Edge event reporting
  - name: Commands
    description: Cloud-to-edge command dispatch
paths:
  /fleet/register:
    post:
      tags: [Nodes]
      summary: Register or refresh an edge node
      operationId: registerNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeRegistrationRequest"
            examples:
              picclaw:
                value:
                  node_id: picclaw-rack-a1
                  name: Rack A1 PicClaw
                  type: picclaw
                  capabilities: [temperature, humidity, relay-control]
                  location:
                    site: dc-1
                    zone: rack-a
      responses:
        "201":
          description: Node registered and marked online
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/BadRequest"

  /fleet/heartbeat:
    post:
      tags: [Nodes]
      summary: Update node liveness and metrics
      operationId: heartbeatNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
            examples:
              healthy:
                value:
                  node_id: picclaw-rack-a1
                  status: online
                  metrics:
                    cpu_pct: 12.5
                    memory_mb: 7.4
                    queue_depth: 0
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /fleet/events:
    post:
      tags: [Events]
      summary: Report a sensor, alert, or lifecycle event
      operationId: reportEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRequest"
            examples:
              thresholdAlert:
                value:
                  node_id: picclaw-rack-a1
                  type: temperature_warning
                  timestamp: "2026-02-16T00:00:00Z"
                  data:
                    temperature_c: 38.4
                    threshold_c: 35
      responses:
        "202":
          description: Event accepted for storage and downstream processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /fleet/command:
    post:
      tags: [Commands]
      summary: Dispatch a command to an edge node
      operationId: dispatchCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
            examples:
              restart:
                value:
                  node_id: picclaw-rack-a1
                  type: restart
                  payload:
                    reason: watchdog timeout
      responses:
        "202":
          description: Command queued for the target node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /fleet/nodes:
    get:
      tags: [Nodes]
      summary: List registered nodes
      operationId: listNodes
      parameters:
        - name: status
          in: query
          required: false
          description: Optional status filter.
          schema:
            $ref: "#/components/schemas/NodeStatus"
      responses:
        "200":
          description: Node inventory
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Node"

  /fleet/nodes/{id}:
    get:
      tags: [Nodes]
      summary: Fetch a single node by ID
      operationId: getNode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: picclaw-rack-a1
      responses:
        "200":
          description: Node details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  responses:
    BadRequest:
      description: Request body is malformed or missing required fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Referenced node or command does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    NodeType:
      type: string
      enum: [picclaw, microclaw, nanoclaw, moltclaw]
    NodeStatus:
      type: string
      enum: [online, degraded, offline]
    NodeRegistrationRequest:
      type: object
      required: [node_id, capabilities]
      properties:
        node_id:
          type: string
          minLength: 1
        name:
          type: string
        type:
          $ref: "#/components/schemas/NodeType"
        capabilities:
          type: array
          minItems: 1
          items:
            type: string
        location:
          type: object
          additionalProperties:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    HeartbeatRequest:
      type: object
      required: [node_id]
      properties:
        node_id:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/NodeStatus"
        metrics:
          type: object
          additionalProperties:
            oneOf:
              - type: number
              - type: string
              - type: boolean
    HeartbeatResponse:
      type: object
      required: [ok, node]
      properties:
        ok:
          type: boolean
        node:
          $ref: "#/components/schemas/Node"
        commands:
          type: array
          description: Commands ready for delivery to the node.
          items:
            $ref: "#/components/schemas/Command"
    EventRequest:
      type: object
      required: [node_id, type, data]
      properties:
        node_id:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    EventAccepted:
      type: object
      required: [ok, event_id]
      properties:
        ok:
          type: boolean
        event_id:
          type: string
        stored_at:
          type: string
          format: date-time
    CommandRequest:
      type: object
      required: [node_id, type]
      properties:
        node_id:
          type: string
          minLength: 1
        type:
          type: string
          enum: [restart, execute_skill, update_config, gpio_write]
        payload:
          type: object
          additionalProperties: true
    Command:
      type: object
      required: [id, node_id, type, status, created_at]
      properties:
        id:
          type: string
        node_id:
          type: string
        type:
          type: string
        status:
          type: string
          enum: [pending, delivered, running, succeeded, failed]
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time
        executed_at:
          type: string
          format: date-time
        error:
          type: string
    Node:
      type: object
      required: [node_id, capabilities, status, last_seen]
      properties:
        node_id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/NodeType"
        capabilities:
          type: array
          items:
            type: string
        location:
          type: object
          additionalProperties:
            type: string
        status:
          $ref: "#/components/schemas/NodeStatus"
        last_seen:
          type: string
          format: date-time
        metrics:
          type: object
          additionalProperties:
            oneOf:
              - type: number
              - type: string
              - type: boolean
        metadata:
          type: object
          additionalProperties:
            type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
